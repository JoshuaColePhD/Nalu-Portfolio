name: Evidence checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check recorded benchmark evidence
        run: python eval/benchmark_report.py --check
      - name: Run deterministic sample cleaner
        run: python eval/cleanup_eval.py
      - name: Unit tests
        run: python -m unittest discover -s eval/tests -v
